name: Publicar BarberOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
        working-directory: barberos-pro
      - name: Compilar aplicación
        run: npm run build
        working-directory: barberos-pro
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: barberos-pro/dist
      - uses: actions/deploy-pages@v4
